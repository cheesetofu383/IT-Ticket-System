<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Profile - IT Support</title>

    <link rel="stylesheet" href="/style.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 800px;
        }

        /* =========================
           HEADER
        ========================= */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 32px;

            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;

            font-size: 15px;
        }


        /* =========================
           PROFILE CARD
        ========================= */

        .profile-card {
            background: white;

            border-radius: 16px;

            padding: 35px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.06);
        }


        /* =========================
           PROFILE HEADER
        ========================= */

        .profile-header {
            display: flex;

            align-items: center;

            gap: 20px;

            padding-bottom: 30px;

            margin-bottom: 25px;

            border-bottom: 1px solid #e5e7eb;
        }

        .profile-icon {
            width: 70px;
            height: 70px;

            border-radius: 50%;

            background: #eef6fc;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;
        }

        .profile-header h2 {
            font-size: 22px;

            margin-bottom: 6px;
        }

        .profile-header p {
            color: #6b7280;

            font-size: 14px;
        }


        /* =========================
           INFORMATION
        ========================= */

        .info-section {
            margin-bottom: 30px;
        }

        .info-section h3 {
            font-size: 17px;

            margin-bottom: 20px;
        }

        .info-row {
            display: grid;

            grid-template-columns: 160px 1fr;

            gap: 15px;

            padding: 15px 0;

            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #6b7280;

            font-size: 14px;

            font-weight: bold;
        }

        .info-value {
            font-size: 14px;

            color: #374151;
        }


        /* =========================
           BUTTON
        ========================= */

        .back-button {
            display: inline-block;

            background: #1769aa;

            color: white;

            text-decoration: none;

            padding: 12px 20px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: bold;
        }

        .back-button:hover {
            background: #12578c;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 650px) {

            .navbar {
                padding: 0 20px;
            }

            .container {
                margin: 30px auto;
            }

            .profile-card {
                padding: 25px;
            }

            .info-row {
                grid-template-columns: 1fr;

                gap: 5px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <div class="logo">
            IT Support
        </div>


        <div class="nav-right">

            <a
                href="/staff.html"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="/"
                class="nav-link"
            >
                Logout
            </a>

        </div>

    </nav>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <!-- HEADER -->

        <section class="page-header">

            <h1>
                Staff Profile
            </h1>

            <p>
                View your IT staff account information.
            </p>

        </section>



        <!-- PROFILE -->

        <section class="profile-card">


            <div class="profile-header">

                <div class="profile-icon">
                    👨‍💻
                </div>


                <!-- AFTER -->
            <div>
                <h2 id="headerName">-</h2>
                <p id="headerRole">IT Support Team</p>
            </div>

            </div>



            <!-- INFORMATION -->

            <!-- AFTER -->
        <div class="info-section">
            <h3>
                Account Information
            </h3>
            
            <div class="info-row">
                <div class="info-label">
                    Name
            </div>
            <div class="info-value" id="profileName">
                    -
            </div>
        </div>

            <div class="info-row">
                <div class="info-label">
                    Email
                </div>
                <div class="info-value" id="profileEmail">
                    -
                </div>
            </div>

            <div class="info-row">
                <div class="info-label">
                    Role
                </div>
                <div class="info-value" id="profileRole">
                    -
                </div>
            </div>

            <div class="info-row">
                <div class="info-label">
                    Department
                </div>
                <div class="info-value" id="profileDepartment">
                    -
                </div>
            </div>
        </div>



            <a
                href="/staff.html"
                class="back-button"
            >
                ← Back to Dashboard
            </a>


        </section>

    </main>
    <script>
        function loadStaffProfile() {
            // Read the "staff" key saved by your staff-login.html
            const rawData = localStorage.getItem("staff");

            if (!rawData) {
                alert("No active session found. Please log in first.");
                window.location.href = "/staff-login.html";
                return;
            }

            const staff = JSON.parse(rawData);

            // Replace the '-' placeholders with data from database.xlsx
            document.getElementById("headerName").textContent = staff.name || "-";
            document.getElementById("headerRole").textContent = staff.role || "IT Support Team";
            document.getElementById("profileName").textContent = staff.name || "-";
            document.getElementById("profileEmail").textContent = staff.email || "-";
            document.getElementById("profileRole").textContent = staff.role || "-";
            document.getElementById("profileDepartment").textContent = staff.department || "-";
        }

        function logout() {
            localStorage.removeItem("staff");
        }

        window.onload = loadStaffProfile;
    </script>

</body>

</html>
